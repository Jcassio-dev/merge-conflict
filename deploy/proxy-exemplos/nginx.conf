# Modo "atrás de proxy": um server novo no nginx que já existe.
# Certificado: gere com o certbot (certbot --nginx -d jogo.seudominio.com.br).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl;
  http2 on;
  server_name jogo.seudominio.com.br;
  ssl_certificate     /etc/letsencrypt/live/jogo.seudominio.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jogo.seudominio.com.br/privkey.pem;

  client_max_body_size 50m;   # upload do mapa

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # WebSocket do WorkAdventure (/ws/)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
}

server {
  listen 80;
  server_name jogo.seudominio.com.br;
  return 301 https://$host$request_uri;
}
